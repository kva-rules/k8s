---
# API Gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticketing-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: AUTH_SERVICE_URI
              value: http://auth-service:8081
            - name: USER_SERVICE_URI
              value: http://user-service:8082
            - name: TICKET_SERVICE_URI
              value: http://ticket-service:8083
            - name: SOLUTION_SERVICE_URI
              value: http://solution-service:8084
            - name: KNOWLEDGE_SERVICE_URI
              value: http://knowledge-service:8085
            - name: REWARD_SERVICE_URI
              value: http://reward-service:8086
            - name: NOTIFICATION_SERVICE_URI
              value: http://notification-service:8087
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ticketing-system
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
---
