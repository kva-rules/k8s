---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticketing-ingress
  namespace: ticketing-system
spec:
  ingressClassName: nginx
  rules:
    - host: ticketing.local
      http:
        paths:
          # Backend API → api-gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # Everything else → frontend (static SPA + /api fallback handled by nginx.conf inside)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
